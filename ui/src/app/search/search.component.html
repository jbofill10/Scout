<div class="page-wrapper">
    <div class="form-container" [ngClass]="{'form-move-up': formSubmitted}">
        <form (ngSubmit)="onSearch()" #searchForm="ngForm">
            <input type="text" name="searchTerm" [(ngModel)]="searchTerm" required placeholder="Search for media" />
        </form>
    </div>
    <div class="app-search-result">
        <div *ngFor="let result of searchResults">
            <app-search-result [result]="result"></app-search-result>
        </div>
    </div>
</div>
