<div class="search-result" (click)="openImageModal()">
    <div class="result-wrapper">
        <div class="media-wrapper">
            <img class="result-image" [src]="result.imageUrl" />
        </div>
        <div class="text">
            <h2>{{ result.mediaName }}</h2>
            <p>{{ result.type }}</p>
        </div>
    </div>
</div>

<app-image-modal *ngIf="isModalOpen" [imageUrl]="result.imageUrl" [caption]="result.mediaName"
    (close)="closeImageModal()">
</app-image-modal>
