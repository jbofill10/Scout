apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-db-pv
  labels:
    app: postgres
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/data/scout/postgres
    type: DirectoryOrCreate
  volumeMode: Filesystem