# API Ingress - with rewrite rule to strip /api prefix
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scout-ingress-api
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  rules:
  - http:
      paths:
      - path: /api/(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: webserver-service
            port:
              number: 22920
---
# OTel Collector Ingress - for browser traces
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scout-ingress-otel
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type"
spec:
  rules:
  - http:
      paths:
      - path: /v1/traces
        pathType: Prefix
        backend:
          service:
            name: otel-collector-service
            port:
              number: 4318
---
# UI Ingress - no rewrite, serve assets as-is
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scout-ingress-ui
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ui-service
            port:
              number: 80