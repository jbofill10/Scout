apiVersion: apps/v1
kind: Deployment
metadata:
  name: torrenter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: torrenter
  template:
    metadata:
      labels:
        app: torrenter
    spec:
      containers:
      - name: torrenter
        image: scout-torrenter:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 22001
        env:
        - name: BIND_ADDRESS
          value: "0.0.0.0:22001"
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_USER
          value: "scoutuser"
        - name: DB_PASSWORD
          value: "scoutpass"
        - name: DB_NAME
          value: "scoutdb"
        # Torrenter config from ConfigMap
        - name: PROWLARR_HOST
          valueFrom:
            configMapKeyRef:
              name: torrenter-config
              key: prowlarr-host
        - name: QBITT_HOST
          valueFrom:
            configMapKeyRef:
              name: torrenter-config
              key: qbitt-host
        - name: PLEX_HOST
          valueFrom:
            configMapKeyRef:
              name: torrenter-config
              key: plex-host
        - name: PLEX_MOVIE_SECTIONS
          valueFrom:
            configMapKeyRef:
              name: torrenter-config
              key: plex-movie-sections
        - name: PLEX_SHOW_SECTIONS
          valueFrom:
            configMapKeyRef:
              name: torrenter-config
              key: plex-show-sections
        - name: UI_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: torrenter-config
              key: ui-endpoint
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "otel-collector-service:4317"
        - name: OTEL_SERVICE_NAME
          value: "torrenter"
        volumeMounts:
        - name: secrets-volume
          mountPath: /root/secrets
        - name: downloads-host
          mountPath: /data/Downloads
        - name: media-host
          mountPath: /data/Media
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: secrets-volume
        secret:
          secretName: torrenter-secrets
      - name: downloads-host
        hostPath:
          path: /data/Downloads
          type: Directory
      - name: media-host
        hostPath:
          path: /data/Media
          type: Directory