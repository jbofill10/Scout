apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: scout-ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: WEBSERVER_API_URL
          value: "http://webserver-service:22920"