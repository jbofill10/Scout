apiVersion: v1
kind: Secret
metadata:
  name: tvdb-proxy-secrets
  namespace: default
type: Opaque
data:
  # Base64 encode your values: echo -n "your_value" | base64
  # Get your TVDB API key from: https://thetvdb.com/api-information
  api-key: <BASE64_ENCODED_TVDB_API_KEY>
  # Generate token using your API key - see SECURITY.md for instructions
  token: <BASE64_ENCODED_TVDB_JWT_TOKEN>
