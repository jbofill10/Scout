apiVersion: v1
kind: Secret
metadata:
  name: torrenter-secrets
  namespace: default
type: Opaque
data:
  # Base64 encode your values: echo -n "your_value" | base64
  prowlarr-key: <BASE64_ENCODED_PROWLARR_API_KEY>
  qbitt-user: <BASE64_ENCODED_QBITTORRENT_USERNAME>
  qbitt-password: <BASE64_ENCODED_QBITTORRENT_PASSWORD>
  plex-key: <BASE64_ENCODED_PLEX_TOKEN>
